      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="logo-wrap">
          <div class="logo-mark">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /></svg>
          </div>
          <span class="logo-text">Circlenet</span>
        </div>
        <nav class="nav">
          <div class="nav-item active" onclick="goTo('feed')" id="snav-feed">
            <svg
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            <span class="nav-label">Feed</span>
          </div>
          <div class="nav-item" onclick="goTo('profile')" id="snav-profile">
            <svg
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <span class="nav-label">Profile</span>
          </div>
          <div class="nav-item" onclick="goTo('search')" id="snav-search">
            <svg
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <span class="nav-label">Search</span>
          </div>
          <div class="nav-item" onclick="goTo('explore')" id="snav-explore">
            <svg
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <polygon points="3 11 22 2 13 21 11 13 3 11" />
            </svg>
            <span class="nav-label">Explore</span>
          </div>
          <div class="nav-item" onclick="goTo('groups')" id="snav-groups">
            <svg
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 00-3-3.87" />
              <path d="M16 3.13a4 4 0 010 7.75" />
            </svg>
            <span class="nav-label">Groups</span>
          </div>
          <div
            class="nav-item"
            onclick="
              window.location.href = 'https://www.circlenet.social/articles'
            "
            id="snav-articles"
          >
            <svg
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path d="M4 4h16v4H4z" />
              <path d="M4 12h10" />
              <path d="M4 16h7" />
              <rect x="14" y="11" width="6" height="9" rx="1" />
            </svg>
            <span class="nav-label">Articles</span>
          </div>
          <div class="nav-item" onclick="openNotifPanel()" id="snav-notif">
            <svg
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 01-3.46 0" />
            </svg>
            <span class="nav-label">Notifications</span>
            <span class="nav-badge" id="snav-notif-badge">0</span>
          </div>
          <div class="nav-item" onclick="Live.openSetup()" id="snav-live">
            <svg
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                d="M15 10l4.553-2.277A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14"
              />
              <rect x="2" y="7" width="13" height="10" rx="2" ry="2" />
              <circle cx="6" cy="5" r="1" fill="currentColor" stroke="none" />
              <circle cx="11" cy="5" r="1" fill="currentColor" stroke="none" />
              <line x1="6" y1="5" x2="11" y2="5" stroke-width="1.5" />
            </svg>
            <span class="nav-label">Go Live</span>
          </div>
          <div class="nav-item" onclick="goTo('messages')" id="snav-messages">
            <svg
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"
              />
            </svg>
            <span class="nav-label">Messages</span>
            <span class="nav-badge" id="snav-dm-badge">0</span>
          </div>

          <div
            class="nav-item"
            onclick="WhisperInbox.open()"
            id="snav-whisper-inbox"
          >
            <svg
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"
              />
              <line x1="9" y1="10" x2="15" y2="10" />
              <line x1="9" y1="14" x2="13" y2="14" />
            </svg>
            <span class="nav-label">Whisper</span>
          </div>
          <div class="nav-item" onclick="goTo('settings')" id="snav-settings">
            <svg
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"
              />
            </svg>
            <span class="nav-label">Settings</span>
          </div>
          <button class="sidebar-create-btn" onclick="openComposeTab()">
            <svg
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              viewBox="0 0 24 24"
              width="18"
              height="18"
            >
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            <span class="nav-label">Create a post</span>
          </button>
        </nav>
        <div
          class="sidebar-bottom"
          id="sidebar-user-area"
          style="display: none"
        >
          <button
            class="nav-item"
            onclick="logout()"
            style="width: 100%; color: var(--rose)"
          >
            <svg
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            <span class="nav-label">Log Out</span>
          </button>
        </div>
      </aside>

      <!-- TOPBAR (mobile) — matches sketch: logo left | notif + message + profile right -->
      <div class="topbar">
        <div class="topbar-logo">
          <div
            class="logo-mark"
            style="width: 30px; height: 30px; border-radius: 9px"
          >
            <svg viewBox="0 0 24 24" style="width: 15px; height: 15px">
              <circle cx="12" cy="12" r="9" fill="white" />
            </svg>
          </div>
          <span>Circle</span>
        </div>
        <div class="topbar-actions">
          <!-- Notification icon -->
          <button
            class="notif-btn"
            onclick="openNotifPanel()"
            id="topbar-notif-btn"
            title="Notifications"
          >
            <svg
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 01-3.46 0" />
            </svg>
            <span class="notif-badge" id="topbar-notif-badge"></span>
          </button>
          <!-- Message icon -->
          <button
            class="icon-btn"
            onclick="goTo('messages')"
            title="Messages"
            id="topbar-messages-btn"
            style="position: relative"
          >
            <svg
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"
              />
            </svg>
            <span class="notif-badge" id="topbar-dm-badge"></span>
          </button>
          <!-- Profile / avatar -->
          <div
            class="av sm"
            id="topbar-avatar"
            style="cursor: pointer"
            onclick="goTo('profile')"
            title="Profile"
          >
            ?
          </div>
        </div>
      </div>
