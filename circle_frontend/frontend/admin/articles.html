<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Circle Admin — Articles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="admin.css" />
    <style>
      /* same styles as before - keep unchanged */
      .form-row {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .form-row .form-group {
        flex: 1;
      }
      /* Full width for form textareas and editor */
      .form-group textarea,
      .form-group .editor {
        width: 100%;
        box-sizing: border-box;
      }
      .tags-input {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }
      .tag-pill {
        background: var(--accent-bg);
        color: var(--accent);
        border-radius: 20px;
        padding: 4px 12px;
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .tag-pill button {
        background: none;
        border: none;
        color: var(--accent);
        cursor: pointer;
        font-size: 14px;
        margin-left: 4px;
      }
      .tag-input-wrapper {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .tag-input-wrapper input {
        flex: 1;
      }
      .cover-preview {
        margin-top: 12px;
        max-width: 200px;
        border-radius: 8px;
        border: 1px solid var(--border);
        overflow: hidden;
      }
      .cover-preview img {
        width: 100%;
        display: block;
      }
      .publish-toggle {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--bg);
        padding: 10px 14px;
        border-radius: var(--radius-sm);
        margin: 20px 0;
        border: 1px solid var(--border);
      }
      .publish-toggle label {
        font-weight: 700;
        color: var(--txt);
      }
      .editor {
        min-height: 300px;
        background: var(--bg);
        border: 1.5px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 12px;
        font-family: monospace;
        font-size: 13px;
        color: var(--txt);
        resize: vertical;
      }
      .article-form-card {
        margin-bottom: 32px;
      }
      /* Reading time indicator */
      .reading-time-info {
        background: var(--accent-bg);
        border-radius: 8px;
        padding: 8px 12px;
        margin-top: 8px;
        font-size: 12px;
        color: var(--accent);
        display: inline-flex;
        align-items: center;
        gap: 12px;
      }
      .reading-time-info span {
        color: var(--txt2);
      }
    </style>
  </head>
  <body>

      <aside class="sidebar">
        <!-- same sidebar content - unchanged -->

          <div class="sidebar-brand-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /></svg>
          </div>

          <span class="sidebar-brand-badge">Admin</span>
        </div>
        <nav class="sidebar-nav">
          <div class="nav-section-label">Main</div>
          <a class="nav-link" href="dashboard.html" data-page="dashboard">

            </svg>Reports</a>

            </svg>Settings</a>

            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">

        </nav>
        <div class="sidebar-footer">
          <div class="admin-info">
            <div class="admin-avatar" id="admin-avatar">A</div>
            <div>
              <div class="admin-name" id="admin-name">Admin</div>
              <div class="admin-role">Super Admin</div>
            </div>
          </div>
        </div>
      </aside>

      <div class="admin-main">
        <div class="topbar">
          <button class="icon-btn mobile-menu-btn" id="mobile-menu-btn">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>
          <div class="topbar-title">Article <span>Management</span></div>
        </div>

        <div class="content">
          <div class="page-header">
            <div>
              <h1>Articles</h1>
              <p>Create, edit and manage blog articles</p>
            </div>
            <button class="btn-primary" id="new-article-btn" onclick="showCreateForm()">
              + New Article
            </button>
          </div>

          <!-- Create / Edit Form -->
          <div id="article-form-card" class="article-form-card" style="display: none">
            <div class="settings-card">
              <div class="settings-card-title" id="form-title">Create Article</div>
              <div class="settings-card-body">
                <div class="form-group">
                  <label>Title *</label>
                  <input type="text" id="article-title" placeholder="Article title" />
                </div>
                <div class="form-group">
                  <label>Excerpt (short summary)</label>
                  <textarea id="article-excerpt" rows="2" placeholder="A short description (optional)"></textarea>
                </div>
                <div class="form-group">
                  <label>Content * (HTML / Markdown)</label>
                  <textarea id="article-content" class="editor" rows="12" placeholder="Write the full article content. You can use HTML tags."></textarea>
                  <!-- Reading time & word count indicator -->
                  <div class="reading-time-info" id="reading-time-indicator">
                    <span>📄 <span id="word-count">0</span> words</span>
                    <span>⏱️ <span id="reading-time">0</span> min read</span>
                  </div>
                </div>
                <div class="form-group">
                  <label>Tags (comma separated)</label>
                  <div class="tag-input-wrapper">
                    <input type="text" id="tag-input" placeholder="e.g. tech, lifestyle, design" />
                    <button type="button" class="btn-action" onclick="addTag()">Add</button>
                  </div>
                  <div class="tags-input" id="tags-container"></div>
                </div>
                <div class="form-group">
                  <label>Cover Image</label>
                  <input type="file" id="cover-image" accept="image/*" />
                  <div id="cover-preview" class="cover-preview" style="display: none">
                    <img id="cover-preview-img" src="" />
                    <button class="btn-action btn-sm" onclick="removeCover()" style="margin-top: 6px">Remove</button>
                  </div>
                </div>
                <div class="publish-toggle">
                  <label>Publish now</label>
                  <input type="checkbox" id="article-published" />
                  <span style="font-size: 12px; color: var(--txt2); margin-left: auto;">Unchecked = save as draft</span>
                </div>
                <div class="modal-actions" style="margin-top: 20px">
                  <button class="btn-cancel" onclick="hideForm()">Cancel</button>
                  <button class="btn-primary" id="save-article-btn" onclick="saveArticle()">Save Article</button>
                </div>
              </div>
            </div>
          </div>

          <!-- Existing Articles List -->
          <div class="table-card">
            <div class="table-header">
              <div class="table-header-title" id="article-count">Loading…</div>
              <div class="search-box">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <circle cx="11" cy="11" r="8" />
                  <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input type="text" id="search-input" placeholder="Search title or author…" oninput="onSearch()" />
              </div>
            </div>
            <div id="table-body">
              <div class="empty-state">
                <div class="spinner dark" style="margin: 0 auto 12px"></div>
                <p>Loading articles…</p>

    <script>
      // ============================================================
      //  ARTICLE API – direct calls to /api/articles
      // ============================================================

      // Base URL for article endpoints (without trailing slash)
      const ARTICLE_API_BASE = (() => {
        const host = window.location.hostname;
        if (host === "admin.circlenet.social") {
          return "https://circleappapp-production.up.railway.app/api/articles";
        }
        // Development: use your mkcert hostname and port
        return "http://localhost:5000/api/articles";
      })();

      // Helper to convert relative image URLs to absolute backend URLs
      function getFullImageUrl(path) {
        if (!path) return null;
        // Already absolute
        if (path.startsWith('http://') || path.startsWith('https://')) {
          return path;
        }
        // Build backend origin (remove "/api/articles")
        const backendOrigin = ARTICLE_API_BASE.replace(/\/api\/articles.*$/, '');
        const relativePath = path.startsWith('/') ? path : '/' + path;
        return backendOrigin + relativePath;
      }

      async function articleFetch(method, path, body = null, formData = false) {
        const token = localStorage.getItem("circle_admin_token");
        if (!token) throw new Error("Not authenticated. Please log in again.");

        const opts = {
          method,
          headers: {
            Authorization: `Bearer ${token}`,
          },
        };
        if (body) {
          if (formData) {
            opts.body = body;
          } else {
            opts.headers["Content-Type"] = "application/json";
            opts.body = JSON.stringify(body);
          }
        }

        const url = ARTICLE_API_BASE + (path.startsWith("/") ? path : "/" + path);
        const res = await fetch(url, opts);

        const contentType = res.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) {
          const text = await res.text();
          throw new Error(`Server error ${res.status}: ${text.slice(0, 200)}`);
        }

        const data = await res.json();
        if (!res.ok) throw new Error(data.message || `Request failed (res.status)`);
        return data;
      }

      async function apiGetArticles(path) {
        return articleFetch("GET", path);
      }
      async function apiPostArticles(path, body, formData = false) {
        return articleFetch("POST", path, body, formData);
      }
      async function apiPutArticles(path, body, formData = false) {
        return articleFetch("PUT", path, body, formData);
      }
      async function apiDeleteArticles(path) {
        return articleFetch("DELETE", path);
      }

      // ============================================================
      //  READING TIME & WORD COUNT HELPERS
      // ============================================================
      function stripHtml(html) {
        if (!html) return '';
        // Create a temporary element to decode HTML entities and strip tags
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        return tmp.textContent || tmp.innerText || '';
      }

      function countWords(text) {
        if (!text) return 0;
        // Split by whitespace and filter empty strings
        return text.trim().split(/\s+/).filter(w => w.length > 0).length;
      }

      function computeReadingTime(htmlContent) {
        const plainText = stripHtml(htmlContent);
        const wordCount = countWords(plainText);
        const minutes = Math.ceil(wordCount / 200);
        return { wordCount, minutes };
      }

      function formatReadingTime(minutes) {
        if (minutes < 1) return '<1 min';
        return `${minutes} min read`;
      }

      // Update the reading time indicator below the editor
      function updateReadingTimeIndicator() {
        const content = document.getElementById("article-content").value;
        const { wordCount, minutes } = computeReadingTime(content);
        document.getElementById("word-count").textContent = wordCount;
        document.getElementById("reading-time").textContent = minutes < 1 ? '<1' : minutes;
      }

      // ============================================================
      //  PAGE STATE
      // ============================================================
      let currentPage = 1;
      let searchTimer = null;
      let editingArticleId = null;
      let currentTags = [];
      let coverFile = null;
      const PER_PAGE = 10;

      // ============================================================
      //  LOAD & RENDER ARTICLES
      // ============================================================
      async function loadArticles() {
        const q = document.getElementById("search-input").value.trim();
        document.getElementById("table-body").innerHTML =
          '<div class="empty-state"><div class="spinner dark" style="margin:0 auto 12px"></div><p>Loading…</p></div>';
        try {
          const res = await apiGetArticles(`/?page=${currentPage}&limit=${PER_PAGE}&q=${encodeURIComponent(q)}`);
          const { articles, hasMore } = res.data;
          document.getElementById("article-count").textContent = `${formatNumber(articles.length)} articles`;
          renderTable(articles);
          renderPagination(
            "pagination",
            currentPage,
            hasMore ? currentPage * PER_PAGE + 1 : currentPage * PER_PAGE,
            PER_PAGE,
            `function(p){currentPage=p;loadArticles();}`
          );
        } catch (e) {
          showToast(e.message, "error");
          document.getElementById("table-body").innerHTML = `<div class="empty-state"><h3>Error</h3><p>${escHtml(e.message)}</p></div>`;
        }
      }

      function renderTable(articles) {
        if (!articles.length) {
          document.getElementById("table-body").innerHTML = `
            <div class="empty-state">
              <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M4 4h16v4H4zM4 12h10M4 16h7"/><rect x="14" y="11" width="6" height="9" rx="1"/></svg>
              <h3>No articles found</h3><p>Create your first article using the "New Article" button.</p>
            </div>`;
          return;
        }
        document.getElementById("table-body").innerHTML = `
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th><th>Cover</th><th>Title</th><th>Author</th><th>Tags</th><th>Status</th><th>Created</th><th>Likes</th><th>Echoes</th><th>Read time</th><th>Actions</th>
              </tr>
            </thead>
            <tbody>${articles.map((a) => articleRow(a)).join("")}</tbody>
          划`;
      }

      function articleRow(a) {
        const statusBadge = a.published ? "badge-green" : "badge-grey";
        const statusText = a.published ? "Published" : "Draft";
        const tagsHtml = (a.tags || []).slice(0, 2).map(t => `<span class="badge badge-purple" style="margin-right:4px">${escHtml(t)}</span>`).join("");
        
        // Compute reading time from content
        let readingTimeHtml = '—';
        if (a.content) {
          const { minutes } = computeReadingTime(a.content);
          readingTimeHtml = formatReadingTime(minutes);
        }

        const coverUrl = getFullImageUrl(a.coverImage);
        let coverHtml = `<div style="width:48px;height:36px;background:var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--txt2)">None</div>`;
        if (coverUrl) {
          coverHtml = `
            <div style="position:relative;width:48px;height:36px;">
              <img src="${escHtml(coverUrl)}" style="width:100%;height:100%;object-fit:cover;border-radius:4px" onerror="this.onerror=null;this.style.display='none';this.nextElementSibling.style.display='flex';" />
              <div style="width:100%;height:100%;background:var(--border);border-radius:4px;display:none;align-items:center;justify-content:center;font-size:10px;color:#c00">⚠️</div>
            </div>
          `;
        }

        return `<tr id="article-row-${a.id}">
          <td data-label="">#${a.id}</td>
          <td data-label="Cover">${coverHtml}</td>
          <td data-label="Title"><strong>${escHtml(a.title)}</strong><div class="post-text-cell" style="white-space:normal">${escHtml((a.excerpt || a.content || '').slice(0, 60))}…</div></td>
          <td data-label="Author">${avatarHtml(null, a.author, 28)} ${escHtml(a.author)}</td>
          <td data-label="Tags">${tagsHtml || "—"}</td>
          <td data-label="Status"><span class="badge ${statusBadge}">${statusText}</span></td>
          <td data-label="Created" style="white-space:nowrap">${formatDate(a.createdAt)}</td>
          <td data-label="Likes">${formatNumber(a.like_count)}</td>
          <td data-label="Echoes">${formatNumber(a.echo_count)}</td>
          <td data-label="Read time">${readingTimeHtml}</td>
          <td data-label="Actions"><div class="actions"><button class="btn-action" onclick="editArticle(${a.id})">Edit</button><button class="btn-action danger" onclick="deleteArticle(${a.id})">Delete</button></div></td>
        </tr>`;
      }

      // ============================================================
      //  CREATE / EDIT FORM
      // ============================================================
      function showCreateForm() {
        editingArticleId = null;
        currentTags = [];
        coverFile = null;
        document.getElementById("article-title").value = "";
        document.getElementById("article-excerpt").value = "";
        document.getElementById("article-content").value = "";
        document.getElementById("article-published").checked = false;
        document.getElementById("cover-preview").style.display = "none";
        document.getElementById("cover-preview-img").src = "";
        document.getElementById("tag-input").value = "";
        renderTags();
        document.getElementById("form-title").textContent = "Create Article";
        document.getElementById("article-form-card").style.display = "block";
        updateReadingTimeIndicator(); // reset word count
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function hideForm() {
        document.getElementById("article-form-card").style.display = "none";
        editingArticleId = null;
      }

      async function editArticle(id) {
        try {
          const res = await apiGetArticles(`/${id}`);
          const art = res.data;
          editingArticleId = art.id;
          document.getElementById("article-title").value = art.title;
          document.getElementById("article-excerpt").value = art.excerpt || "";
          document.getElementById("article-content").value = art.content;
          document.getElementById("article-published").checked = art.published;
          currentTags = [...(art.tags || [])];
          renderTags();
          if (art.coverImage) {
            const fullCover = getFullImageUrl(art.coverImage);
            document.getElementById("cover-preview-img").src = fullCover || "";
            document.getElementById("cover-preview").style.display = "block";
          } else {
            document.getElementById("cover-preview").style.display = "none";
          }
          coverFile = null;
          document.getElementById("form-title").textContent = "Edit Article";
          document.getElementById("article-form-card").style.display = "block";
          updateReadingTimeIndicator(); // update based on loaded content
          window.scrollTo({ top: 0, behavior: "smooth" });
        } catch (e) {
          showToast("Failed to load article: " + e.message, "error");
        }
      }

      function addTag() {
        const input = document.getElementById("tag-input");
        const tag = input.value.trim().toLowerCase();
        if (!tag) return;
        if (currentTags.includes(tag)) {
          showToast("Tag already added", "error");
          return;
        }
        currentTags.push(tag);
        input.value = "";
        renderTags();
      }
      function removeTag(tag) {
        currentTags = currentTags.filter((t) => t !== tag);
        renderTags();
      }
      function renderTags() {
        const container = document.getElementById("tags-container");
        container.innerHTML = currentTags.map(t => `<div class="tag-pill">${escHtml(t)} <button type="button" onclick="removeTag('${escHtml(t)}')">✕</button></div>`).join("");
      }

      function removeCover() {
        coverFile = null;
        document.getElementById("cover-preview").style.display = "none";
        document.getElementById("cover-preview-img").src = "";
        document.getElementById("cover-image").value = "";
      }

      async function saveArticle() {
        const title = document.getElementById("article-title").value.trim();
        const content = document.getElementById("article-content").value.trim();
        if (!title || !content) {
          showToast("Title and content are required.", "error");
          return;
        }
        const excerpt = document.getElementById("article-excerpt").value.trim() || null;
        const published = document.getElementById("article-published").checked;

        const formData = new FormData();
        formData.append("title", title);
        formData.append("content", content);
        if (excerpt) formData.append("excerpt", excerpt);
        formData.append("published", published ? "true" : "false");
        formData.append("tags", JSON.stringify(currentTags));
        if (coverFile instanceof File) formData.append("image", coverFile);

        const btn = document.getElementById("save-article-btn");
        const originalText = btn.textContent;
        btn.disabled = true;
        btn.textContent = "Saving…";

        try {
          if (editingArticleId) {
            await apiPutArticles(`/${editingArticleId}`, formData, true);
            showToast("Article updated!", "success");
          } else {
            await apiPostArticles("/", formData, true);
            showToast("Article created!", "success");
          }
          hideForm();
          currentPage = 1;
          await loadArticles();
        } catch (e) {
          showToast(e.message, "error");
        } finally {
          btn.disabled = false;
          btn.textContent = originalText;
        }
      }

      async function deleteArticle(id) {
        const ok = await showConfirm("Delete Article", "This will permanently delete the article and all its likes, echoes, and comments.", "Delete");
        if (!ok) return;
        try {
          await apiDeleteArticles(`/${id}`);
          showToast("Article deleted.", "success");
          loadArticles();
        } catch (e) {
          showToast(e.message, "error");
        }
      }

      function onSearch() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          currentPage = 1;
          loadArticles();
        }, 300);
      }

      document.getElementById("cover-image").addEventListener("change", function (e) {
        const file = e.target.files[0];
        if (!file) return;
        coverFile = file;
        const reader = new FileReader();
        reader.onload = function (ev) {
          document.getElementById("cover-preview-img").src = ev.target.result;
          document.getElementById("cover-preview").style.display = "block";
        };
        reader.readAsDataURL(file);
      });

      // Listen to content changes for live reading time
      document.getElementById("article-content").addEventListener("input", updateReadingTimeIndicator);

      // ============================================================
      //  HELPER FUNCTIONS (safe fallbacks)
      // ============================================================
      function escHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          return m;
        });
      }

      function formatDate(iso) {
        if (!iso) return '—';
        try {
          const d = new Date(iso);
          return d.toLocaleDateString();
        } catch(e) { return '—'; }
      }

      function formatNumber(n) {
        if (n === undefined || n === null) return '0';
        return n.toLocaleString();
      }

      function avatarHtml(avatar, name, size) {
        const initial = (name && name[0]) ? name[0].toUpperCase() : 'U';
        return `<div style="display:inline-block;width:${size}px;height:${size}px;background:#ccc;border-radius:50%;text-align:center;line-height:${size}px;font-size:${size/2}px;margin-right:6px">${initial}</div>`;
      }

      function showToast(msg, type) {
        // Simple alert for demo – replace with proper toast if available
        alert(msg);
      }

      function showConfirm(title, msg, confirmText) {
        return confirm(msg);
      }

      function requireAdminAuth() {
        return !!localStorage.getItem("circle_admin_token");
      }

      function initAdminPage(page) {
        console.log("Init page:", page);
      }

      function renderPagination(containerId, currentPage, totalItems, perPage, onPageChangeFnStr) {
        const container = document.getElementById(containerId);
        if (!container) return;
        const totalPages = Math.ceil(totalItems / perPage);
        if (totalPages <= 1) {
          container.innerHTML = '';
          return;
        }
        let html = '<div class="pagination-controls">';
        if (currentPage > 1) {
          html += `<button class="btn-action" onclick="(${onPageChangeFnStr})(${currentPage-1})">Previous</button>`;
        }
        html += `<span>Page ${currentPage}</span>`;
        if (currentPage < totalPages) {
          html += `<button class="btn-action" onclick="(${onPageChangeFnStr})(${currentPage+1})">Next</button>`;
        }
        html += '</div>';
        container.innerHTML = html;
      }

      function adminLogout() {
        localStorage.removeItem("circle_admin_token");
        window.location.href = "login.html";
      }

      // ============================================================
      //  BOOTSTRAP
      // ============================================================
      if (!requireAdminAuth()) {
        // optionally redirect
      }
      initAdminPage("articles");
      loadArticles();
    </script>
  </body>
</html>
