<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Circle Admin — Articles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="admin.css" />
    <style>
      /* same styles as before - keep unchanged */
      .form-row {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .form-row .form-group {
        flex: 1;
      }
      .tags-input {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }
      .tag-pill {
        background: var(--accent-bg);
        color: var(--accent);
        border-radius: 20px;
        padding: 4px 12px;
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .tag-pill button {
        background: none;
        border: none;
        color: var(--accent);
        cursor: pointer;
        font-size: 14px;
        margin-left: 4px;
      }
      .tag-input-wrapper {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .tag-input-wrapper input {
        flex: 1;
      }
      .cover-preview {
        margin-top: 12px;
        max-width: 200px;
        border-radius: 8px;
        border: 1px solid var(--border);
        overflow: hidden;
      }
      .cover-preview img {
        width: 100%;
        display: block;
      }
      .publish-toggle {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--bg);
        padding: 10px 14px;
        border-radius: var(--radius-sm);
        margin: 20px 0;
        border: 1px solid var(--border);
      }
      .publish-toggle label {
        font-weight: 700;
        color: var(--txt);
      }
      .editor {
        min-height: 300px;
        background: var(--bg);
        border: 1.5px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 12px;
        font-family: monospace;
        font-size: 13px;
        color: var(--txt);
        resize: vertical;
      }
      .article-form-card {
        margin-bottom: 32px;
      }
    </style>
  </head>

            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /></svg>

          <span class="sidebar-brand-badge">Admin</span>

        <nav class="sidebar-nav">

            <svg

              viewBox="0 0 24 24"

              <rect x="3" y="3" width="7" height="7" rx="1" />
              <rect x="14" y="3" width="7" height="7" rx="1" />
              <rect x="3" y="14" width="7" height="7" rx="1" />
              <rect x="14" y="14" width="7" height="7" rx="1" /></svg
            >Dashboard</a
          >
          <a class="nav-link" href="users.html" data-page="users">

              <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />

              <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" /></svg

          <a class="nav-link" href="articles.html" data-page="articles">

          >

          <div class="nav-section-label" style="margin-top: 8px">Account</div>

            <svg

              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"

          <a class="nav-link" href="#" onclick="adminLogout()">

            >

              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" /></svg
            >Logout</a
          >
        </nav>
        <div class="sidebar-footer">
          <div class="admin-info">
            <div class="admin-avatar" id="admin-avatar">A</div>
            <div>
              <div class="admin-name" id="admin-name">Admin</div>
              <div class="admin-role">Super Admin</div>
            </div>
          </div>
        </div>
      </aside>

      <div class="admin-main">
        <div class="topbar">
          <button class="icon-btn mobile-menu-btn" id="mobile-menu-btn">
            <svg
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>
          <div class="topbar-title">Article <span>Management</span></div>
        </div>

        <div class="content">
          <div class="page-header">
            <div>
              <h1>Articles</h1>
              <p>Create, edit and manage blog articles</p>
            </div>
            <button
              class="btn-primary"
              id="new-article-btn"
              onclick="showCreateForm()"
            >
              + New Article
            </button>
          </div>

          <!-- Create / Edit Form -->
          <div
            id="article-form-card"
            class="article-form-card"
            style="display: none"
          >
            <div class="settings-card">
              <div class="settings-card-title" id="form-title">
                Create Article
              </div>
              <div class="settings-card-body">
                <div class="form-group">
                  <label>Title *</label>
                  <input
                    type="text"
                    id="article-title"
                    placeholder="Article title"
                  />
                </div>
                <div class="form-group">
                  <label>Excerpt (short summary)</label>
                  <textarea
                    id="article-excerpt"
                    rows="2"
                    placeholder="A short description (optional)"
                  ></textarea>
                </div>
                <div class="form-group">
                  <label>Content * (HTML / Markdown)</label>
                  <textarea
                    id="article-content"
                    class="editor"
                    rows="12"
                    placeholder="Write the full article content. You can use HTML tags."
                  ></textarea>
                </div>
                <div class="form-group">
                  <label>Tags (comma separated)</label>
                  <div class="tag-input-wrapper">
                    <input
                      type="text"
                      id="tag-input"
                      placeholder="e.g. tech, lifestyle, design"
                    />
                    <button type="button" class="btn-action" onclick="addTag()">
                      Add
                    </button>
                  </div>
                  <div class="tags-input" id="tags-container"></div>
                </div>
                <div class="form-group">
                  <label>Cover Image</label>
                  <input type="file" id="cover-image" accept="image/*" />
                  <div
                    id="cover-preview"
                    class="cover-preview"
                    style="display: none"
                  >
                    <img id="cover-preview-img" src="" />
                    <button
                      class="btn-action btn-sm"
                      onclick="removeCover()"
                      style="margin-top: 6px"
                    >
                      Remove
                    </button>
                  </div>
                </div>
                <div class="publish-toggle">
                  <label>Publish now</label>
                  <input type="checkbox" id="article-published" />
                  <span
                    style="
                      font-size: 12px;
                      color: var(--txt2);
                      margin-left: auto;
                    "
                    >Unchecked = save as draft</span
                  >
                </div>
                <div class="modal-actions" style="margin-top: 20px">
                  <button class="btn-cancel" onclick="hideForm()">
                    Cancel
                  </button>
                  <button
                    class="btn-primary"
                    id="save-article-btn"
                    onclick="saveArticle()"
                  >
                    Save Article
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Existing Articles List -->
          <div class="table-card">
            <div class="table-header">
              <div class="table-header-title" id="article-count">Loading…</div>
              <div class="search-box">
                <svg
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <circle cx="11" cy="11" r="8" />
                  <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input
                  type="text"
                  id="search-input"
                  placeholder="Search title or author…"
                  oninput="onSearch()"
                />
              </div>
            </div>
            <div id="table-body">
              <div class="empty-state">
                <div class="spinner dark" style="margin: 0 auto 12px"></div>
                <p>Loading articles…</p>
              </div>
            </div>
            <div class="pagination" id="pagination"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="admin.js"></script>
    <script>
      // ============================================================
      //  ARTICLE API – direct calls to /api/articles (not via admin prefix)
      //  Uses the same token from localStorage.
      // ============================================================

      // Base URL for article endpoints (without trailing slash)
      const ARTICLE_API_BASE = (() => {
        const host = window.location.hostname;
        if (host === "admin.circlenet.social") {
          return "https://circleappapp-production.up.railway.app/api/articles";
        }
        // For local development – use the same origin as the page (assuming backend serves admin)
        return "http://sizabeats:5000/api/articles";
      })();

      async function articleFetch(method, path, body = null, formData = false) {
        const token = localStorage.getItem("circle_admin_token");
        if (!token) throw new Error("Not authenticated. Please log in again.");

        const opts = {
          method,
          headers: {
            Authorization: `Bearer ${token}`,
          },
        };
        if (body) {
          if (formData) {
            opts.body = body;
          } else {
            opts.headers["Content-Type"] = "application/json";
            opts.body = JSON.stringify(body);
          }
        }

        const url =
          ARTICLE_API_BASE + (path.startsWith("/") ? path : "/" + path);
        const res = await fetch(url, opts);

        // Handle non-JSON responses gracefully
        const contentType = res.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) {
          const text = await res.text();
          throw new Error(`Server error ${res.status}: ${text.slice(0, 200)}`);
        }

        const data = await res.json();
        if (!res.ok)
          throw new Error(data.message || `Request failed (${res.status})`);
        return data;
      }

      // Convenience wrappers
      async function apiGetArticles(path) {
        return articleFetch("GET", path);
      }
      async function apiPostArticles(path, body, formData = false) {
        return articleFetch("POST", path, body, formData);
      }
      async function apiPutArticles(path, body, formData = false) {
        return articleFetch("PUT", path, body, formData);
      }
      async function apiDeleteArticles(path) {
        return articleFetch("DELETE", path);
      }

      // ============================================================
      //  PAGE STATE
      // ============================================================
      let currentPage = 1;
      let searchTimer = null;
      let editingArticleId = null;
      let currentTags = [];
      let coverFile = null;
      const PER_PAGE = 10;

      // ============================================================
      //  LOAD & RENDER ARTICLES
      // ============================================================
      async function loadArticles() {
        const q = document.getElementById("search-input").value.trim();
        document.getElementById("table-body").innerHTML =
          '<div class="empty-state"><div class="spinner dark" style="margin:0 auto 12px"></div><p>Loading…</p></div>';
        try {
          const res = await apiGetArticles(
            `/?page=${currentPage}&limit=${PER_PAGE}&q=${encodeURIComponent(q)}`,
          );
          const { articles, hasMore } = res.data;
          const count =
            articles.length +
            (currentPage > 1 ? (currentPage - 1) * PER_PAGE : 0);
          document.getElementById("article-count").textContent =
            `${formatNumber(articles.length)} articles`;
          renderTable(articles);
          // Simple prev/next pagination since API uses cursor-style hasMore
          renderPagination(
            "pagination",
            currentPage,
            hasMore ? currentPage * PER_PAGE + 1 : currentPage * PER_PAGE,
            PER_PAGE,
            `function(p){currentPage=p;loadArticles()}`,
          );
        } catch (e) {
          showToast(e.message, "error");
          document.getElementById("table-body").innerHTML =
            `<div class="empty-state"><h3>Error</h3><p>${escHtml(e.message)}</p></div>`;
        }
      }

      function renderTable(articles) {
        if (!articles.length) {
          document.getElementById("table-body").innerHTML = `
      <div class="empty-state">
        <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M4 4h16v4H4zM4 12h10M4 16h7"/><rect x="14" y="11" width="6" height="9" rx="1"/></svg>
        <h3>No articles found</h3><p>Create your first article using the "New Article" button.</p>
      </div>`;
          return;
        }
        document.getElementById("table-body").innerHTML = `
    <table class="data-table">
      <thead><tr><th>ID</th><th>Cover</th><th>Title</th><th>Author</th><th>Tags</th><th>Status</th><th>Created</th><th>Likes</th><th>Echoes</th><th>Actions</th></tr></thead>
      <tbody>${articles.map((a) => articleRow(a)).join("")}</tbody>
    </table>`;
      }

      function articleRow(a) {
        const statusBadge = a.published ? "badge-green" : "badge-grey";
        const statusText = a.published ? "Published" : "Draft";
        const tagsHtml = (a.tags || [])
          .slice(0, 2)
          .map(
            (t) =>
              `<span class="badge badge-purple" style="margin-right:4px">${escHtml(t)}</span>`,
          )
          .join("");
        const coverHtml = a.coverImage
          ? `<img src="${escHtml(a.coverImage)}" style="width:48px;height:36px;object-fit:cover;border-radius:4px;display:block"/>`
          : `<div style="width:48px;height:36px;background:var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--txt2)">None</div>`;
        return `<tr id="article-row-${a.id}">
    <td data-label="">#${a.id}</td>
    <td data-label="Cover">${coverHtml}</td>
    <td data-label="Title"><strong>${escHtml(a.title)}</strong><div class="post-text-cell" style="white-space:normal">${escHtml((a.excerpt || a.content).slice(0, 60))}…</div></td>
    <td data-label="Author">${avatarHtml(null, a.author, 28)} ${escHtml(a.author)}</td>
    <td data-label="Tags">${tagsHtml || "—"}</td>
    <td data-label="Status"><span class="badge ${statusBadge}">${statusText}</span></td>
    <td data-label="Created" style="white-space:nowrap">${formatDate(a.createdAt)}</td>
    <td data-label="Likes">${formatNumber(a.like_count)}</td>
    <td data-label="Echoes">${formatNumber(a.echo_count)}</td>
    <td data-label="Actions">
      <div class="actions">
        <button class="btn-action" onclick="editArticle(${a.id})">Edit</button>
        <button class="btn-action danger" onclick="deleteArticle(${a.id})">Delete</button>
      </div>
    </td>
  </tr>`;
      }

      // ============================================================
      //  CREATE / EDIT FORM
      // ============================================================
      function showCreateForm() {
        editingArticleId = null;
        currentTags = [];
        coverFile = null;
        document.getElementById("article-title").value = "";
        document.getElementById("article-excerpt").value = "";
        document.getElementById("article-content").value = "";
        document.getElementById("article-published").checked = false;
        document.getElementById("cover-preview").style.display = "none";
        document.getElementById("cover-preview-img").src = "";
        document.getElementById("tag-input").value = "";
        renderTags();
        document.getElementById("form-title").textContent = "Create Article";
        document.getElementById("article-form-card").style.display = "block";
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function hideForm() {
        document.getElementById("article-form-card").style.display = "none";
        editingArticleId = null;
      }

      async function editArticle(id) {
        try {
          const res = await apiGetArticles(`/${id}`);
          const art = res.data;
          editingArticleId = art.id;
          document.getElementById("article-title").value = art.title;
          document.getElementById("article-excerpt").value = art.excerpt || "";
          document.getElementById("article-content").value = art.content;
          document.getElementById("article-published").checked = art.published;
          currentTags = [...(art.tags || [])];
          renderTags();
          if (art.coverImage) {
            document.getElementById("cover-preview-img").src = art.coverImage;
            document.getElementById("cover-preview").style.display = "block";
          } else {
            document.getElementById("cover-preview").style.display = "none";
          }
          coverFile = null;
          document.getElementById("form-title").textContent = "Edit Article";
          document.getElementById("article-form-card").style.display = "block";
          window.scrollTo({ top: 0, behavior: "smooth" });
        } catch (e) {
          showToast("Failed to load article: " + e.message, "error");
        }
      }

      function addTag() {
        const input = document.getElementById("tag-input");
        const tag = input.value.trim().toLowerCase();
        if (!tag) return;
        if (currentTags.includes(tag)) {
          showToast("Tag already added", "error");
          return;
        }
        currentTags.push(tag);
        input.value = "";
        renderTags();
      }
      function removeTag(tag) {
        currentTags = currentTags.filter((t) => t !== tag);
        renderTags();
      }
      function renderTags() {
        const container = document.getElementById("tags-container");
        container.innerHTML = currentTags
          .map(
            (t) => `
    <div class="tag-pill">${escHtml(t)} <button type="button" onclick="removeTag('${escHtml(t)}')">✕</button></div>
  `,
          )
          .join("");
      }

      function removeCover() {
        coverFile = null;
        document.getElementById("cover-preview").style.display = "none";
        document.getElementById("cover-preview-img").src = "";
        document.getElementById("cover-image").value = "";
      }

      async function saveArticle() {
        const title = document.getElementById("article-title").value.trim();
        const content = document.getElementById("article-content").value.trim();
        if (!title || !content) {
          showToast("Title and content are required.", "error");
          return;
        }
        const excerpt =
          document.getElementById("article-excerpt").value.trim() || null;
        const published = document.getElementById("article-published").checked;

        const formData = new FormData();
        formData.append("title", title);
        formData.append("content", content);
        if (excerpt) formData.append("excerpt", excerpt);
        formData.append("published", published ? "true" : "false");
        formData.append("tags", JSON.stringify(currentTags));
        if (coverFile instanceof File) formData.append("image", coverFile);

        const btn = document.getElementById("save-article-btn");
        const originalText = btn.textContent;
        btn.disabled = true;
        btn.textContent = "Saving…";

        try {
          if (editingArticleId) {
            await apiPutArticles(`/${editingArticleId}`, formData, true);
            showToast("Article updated!", "success");
          } else {
            await apiPostArticles("/", formData, true);
            showToast("Article created!", "success");
          }
          hideForm();
          currentPage = 1;
          await loadArticles();
        } catch (e) {
          showToast(e.message, "error");
        } finally {
          btn.disabled = false;
          btn.textContent = originalText;
        }
      }

      async function deleteArticle(id) {
        const ok = await showConfirm(
          "Delete Article",
          "This will permanently delete the article and all its likes, echoes, and comments.",
          "Delete",
        );
        if (!ok) return;
        try {
          await apiDeleteArticles(`/${id}`);
          showToast("Article deleted.", "success");
          loadArticles();
        } catch (e) {
          showToast(e.message, "error");
        }
      }

      function onSearch() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          currentPage = 1;
          loadArticles();
        }, 300);
      }

      document
        .getElementById("cover-image")
        .addEventListener("change", function (e) {
          const file = e.target.files[0];
          if (!file) return;
          coverFile = file;
          const reader = new FileReader();
          reader.onload = function (ev) {
            document.getElementById("cover-preview-img").src = ev.target.result;
            document.getElementById("cover-preview").style.display = "block";
          };
          reader.readAsDataURL(file);
        });

      // ============================================================
      //  BOOTSTRAP
      // ============================================================
      if (!requireAdminAuth()) throw new Error();
      initAdminPage("articles");
      loadArticles();
    </script>
  </body>
</html>
