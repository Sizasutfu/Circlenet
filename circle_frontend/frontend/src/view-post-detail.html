        <!-- POST DETAIL -->
        <div class="view" id="view-post-detail">
          <div class="post-detail-topbar">
            <button
              class="back-btn"
              onclick="closePostDetail()"
              aria-label="Go back"
            >
              <svg
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                viewBox="0 0 24 24"
                width="22"
                height="22"
              >
                <polyline points="15 18 9 12 15 6" />
              </svg>
            </button>
            <h1 style="font-size: 20px; margin: 0">Post</h1>
          </div>
          <div
            class="content"
            id="post-detail-scroll-content"
            style="
              flex: 1;
              overflow-y: auto;
              padding-top: 16px;
              padding-bottom: 20px;
            "
          >
            <div id="post-detail-content"></div>
            <div
              id="post-detail-comments"
              style="margin-top: 8px; padding-bottom: 80px"
            ></div>
          </div>
          <div class="post-detail-reply-bar" id="post-detail-reply-bar">
            <div
              id="reply-to-banner"
              style="display: none"
              class="reply-to-banner"
            >
              <svg
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                viewBox="0 0 24 24"
              >
                <polyline points="9 17 4 12 9 7" />
                <path d="M20 18v-2a4 4 0 00-4-4H4" />
              </svg>
              <span id="reply-to-label">Replying to <strong></strong></span>
              <button
                class="reply-cancel-btn"
                onclick="cancelReply()"
                title="Cancel reply"
              >
                ✕
              </button>
            </div>
            <div class="comment-input-row">
              <input
                class="comment-input"
                id="post-detail-reply-input"
                type="text"
                placeholder="Write a reply…"
                onkeydown="if (event.key === 'Enter') postDetailAddComment();"
              />
              <button
                class="send-btn"
                onclick="postDetailAddComment()"
                aria-label="Send reply"
              >
                <svg
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  viewBox="0 0 24 24"
                >
                  <line x1="22" y1="2" x2="11" y2="13" />
                  <polygon points="22 2 15 22 11 13 2 9 22 2" />
                </svg>
              </button>
            </div>
          </div>
        </div>

        <!-- ── Compose full-tab view ── -->
        <div
          class="view"
          id="view-compose"
          onclick="handleComposeBackdropClick(event)"
        >
          <div class="compose-tab-inner">
            <div class="compose-tab-header">
              <button class="compose-tab-cancel" onclick="closeComposeTab()">
                Cancel
              </button>
              <span class="compose-tab-title">New Post</span>
              <button
                class="compose-tab-post-btn"
                id="compose-tab-submit"
                onclick="createPostFromTab()"
              >
                Post
              </button>
            </div>
            <div class="compose-tab-progress" id="compose-tab-progress">
              <div
                class="compose-tab-progress-bar"
                id="compose-tab-progress-bar"
              ></div>
            </div>
            <div class="compose-tab-body">
              <div class="compose-tab-av">
                <div class="av" id="compose-tab-av">?</div>
              </div>
              <div class="compose-tab-right">
                <textarea
                  class="compose-tab-textarea"
                  id="compose-tab-text"
                  placeholder="What's on your mind?"
                  oninput="
                    composeTabInput(this);
                    composeTabDetectLink(this.value);
                  "
                  rows="5"
                ></textarea>
                <div
                  class="compose-tab-media-preview"
                  id="compose-tab-media-preview"
                >
                  <img
                    id="compose-tab-img-preview"
                    src=""
                    alt=""
                    style="display: none"
                  />
                  <video
                    id="compose-tab-video-preview"
                    controls
                    style="display: none"
                  ></video>
                  <button
                    class="compose-tab-media-remove"
                    onclick="removeComposeTabMedia()"
                  >
                    ✕
                  </button>
                </div>
                <div
                  class="compose-link-preview"
                  id="compose-link-preview"
                  style="display: none"
                >
                  <button
                    class="compose-link-preview-dismiss"
                    onclick="dismissLinkPreview()"
                    aria-label="Remove preview"
                  >
                    ✕
                  </button>
                  <div
                    class="compose-link-preview-img-wrap"
                    id="compose-link-preview-img-wrap"
                    style="display: none"
                  >
                    <img id="compose-link-preview-img" src="" alt="" />
                  </div>
                  <div class="compose-link-preview-body">
                    <span
                      class="compose-link-preview-domain"
                      id="compose-link-preview-domain"
                    ></span>
                    <span
                      class="compose-link-preview-title"
                      id="compose-link-preview-title"
                    ></span>
                    <span
                      class="compose-link-preview-desc"
                      id="compose-link-preview-desc"
                    ></span>
                  </div>
                </div>
              </div>
            </div>
            <div class="compose-tab-toolbar">
              <label
                class="compose-tab-tool"
                for="compose-tab-img-input"
                title="Add photo"
              >
                <svg
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <rect x="3" y="3" width="18" height="18" rx="2" />
                  <circle cx="8.5" cy="8.5" r="1.5" />
                  <polyline points="21 15 16 10 5 21" />
                </svg>
                Photo
              </label>
              <input
                type="file"
                id="compose-tab-img-input"
                class="hidden"
                accept="image/*"
                onchange="composeTabPreviewImage(event)"
              />
              <label
                class="compose-tab-tool"
                for="compose-tab-video-input"
                title="Add video"
              >
                <svg
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <polygon points="23 7 16 12 23 17 23 7" />
                  <rect x="1" y="5" width="15" height="14" rx="2" />
                </svg>
                Video
              </label>
              <input
                type="file"
                id="compose-tab-video-input"
                class="hidden"
                accept="video/*"
                onchange="composeTabPreviewVideo(event)"
              />
              <button
                class="compose-tab-tool compose-tab-tool--live"
                title="Go Live"
                onclick="
                  closeComposeTab();
                  Live.openSetup();
                "
                type="button"
              >
                <svg
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <circle
                    cx="12"
                    cy="12"
                    r="3"
                    fill="currentColor"
                    stroke="none"
                  />
                  <path d="M6.3 6.3a8 8 0 0 0 0 11.4" />
                  <path d="M17.7 6.3a8 8 0 0 1 0 11.4" />
                  <path d="M3.5 3.5a13.5 13.5 0 0 0 0 17" />
                  <path d="M20.5 3.5a13.5 13.5 0 0 1 0 17" />
                </svg>
                Go Live
              </button>

              <span
                class="compose-tab-char-count"
                id="compose-tab-char-count"
              ></span>
            </div>
          </div>
          <!-- /.compose-tab-inner -->
        </div>
      </main>
