          <!-- MESSAGES (DM) -->
          <div class="view" id="view-messages">
            <div
              class="page-header"
              style="
                margin-bottom: 16px;
                display: flex;
                align-items: center;
                justify-content: space-between;
              "
            >
              <div>
                <button
                  class="back-btn"
                  onclick="goBack()"
                  id="back-btn-messages"
                >
                  <svg
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    viewBox="0 0 24 24"
                  >
                    <polyline points="15 18 9 12 15 6" />
                  </svg>
                </button>
                <h1><em>Messages</em></h1>
                <p>Private conversations</p>
              </div>
              <button
                class="btn btn-ghost"
                style="font-size: 13px; padding: 8px 16px; gap: 7px"
                onclick="openNewDMModal()"
              >
                <svg
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  viewBox="0 0 24 24"
                  width="15"
                  height="15"
                >
                  <line x1="12" y1="5" x2="12" y2="19" />
                  <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                New Message
              </button>
            </div>
            <div class="dm-shell" id="dm-shell">
              <!-- Inbox list -->
              <div class="dm-inbox" id="dm-inbox">
                <div class="dm-inbox-head">
                  <h2>Inbox</h2>
                  <div class="dm-inbox-search">
                    <svg
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      viewBox="0 0 24 24"
                    >
                      <circle cx="11" cy="11" r="8" />
                      <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <input
                      type="text"
                      id="dm-inbox-search"
                      placeholder="Search conversations…"
                      oninput="dmFilterInbox()"
                      autocomplete="off"
                    />
                  </div>
                </div>
                <div class="dm-conv-list" id="dm-conv-list">
                  <div class="dm-conv-empty">
                    <svg
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.5"
                      viewBox="0 0 24 24"
                    >
                      <path
                        d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"
                      />
                    </svg>
                    <p>No conversations yet.<br />Start one!</p>
                  </div>
                </div>
              </div>
              <!-- Chat area -->
              <div class="dm-chat" id="dm-chat">
                <div class="dm-chat-empty" id="dm-chat-empty">
                  <svg
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.2"
                    viewBox="0 0 24 24"
                  >
                    <path
                      d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"
                    />
                  </svg>
                  <h3>Your Messages</h3>
                  <p>Send a private message to anyone on Circle.</p>
                  <button
                    class="btn btn-primary"
                    style="font-size: 13px; padding: 9px 20px"
                    onclick="openNewDMModal()"
                  >
                    Start a conversation
                  </button>
                </div>
                <div
                  id="dm-chat-active"
                  style="display: none; flex-direction: column; height: 100%"
                >
                  <div class="dm-chat-head">
                    <button
                      class="dm-chat-back"
                      id="dm-back-btn"
                      onclick="dmBackToInbox()"
                    >
                      <svg
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        viewBox="0 0 24 24"
                      >
                        <polyline points="15 18 9 12 15 6" />
                      </svg>
                    </button>
                    <div class="av sm" id="dm-chat-av"></div>
                    <div class="dm-chat-head-info">
                      <div class="dm-chat-head-name" id="dm-chat-name"></div>
                      <div
                        class="dm-chat-head-status"
                        id="dm-chat-status"
                        style="display: none"
                      ></div>
                    </div>
                    <button
                      class="icon-btn"
                      onclick="openNewDMModal()"
                      title="New message"
                      style="flex-shrink: 0"
                    >
                      <svg
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        viewBox="0 0 24 24"
                      >
                        <path
                          d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"
                        />
                        <path
                          d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"
                        />
                      </svg>
                    </button>
                  </div>
                  <div class="dm-messages" id="dm-messages"></div>
                  <div
                    id="dm-typing-indicator"
                    style="
                      display: none;
                      align-items: center;
                      gap: 6px;
                      padding: 2px 16px 6px;
                      min-height: 22px;
                    "
                  >
                    <span style="font-size: 12px; color: var(--txt3)"
                      >typing</span
                    >
                    <span class="dm-typing-dots"
                      ><span></span><span></span><span></span
                    ></span>
                  </div>
                  <div class="dm-compose">
                    <textarea
                      class="dm-compose-input"
                      id="dm-compose-input"
                      placeholder="Message…"
                      rows="1"
                      oninput="dmAutoResize(this)"
                      onkeydown="dmSendOnEnter(event)"
                    ></textarea>
                    <button
                      class="dm-send-btn"
                      id="dm-send-btn"
                      onclick="dmSendMessage()"
                    >
                      <svg
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        viewBox="0 0 24 24"
                      >
                        <line x1="22" y1="2" x2="11" y2="13" />
                        <polygon points="22 2 15 22 11 13 2 9 22 2" />
                      </svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
