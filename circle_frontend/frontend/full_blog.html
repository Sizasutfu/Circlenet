  <!-- Google Fonts & Stylesheet -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Bricolage+Grotesque:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --radius: 16px;
      --radius-sm: 10px;
      --font-body: "Plus Jakarta Sans", sans-serif;
      --font-head: "Bricolage Grotesque", sans-serif;
    }
    [data-theme="dark"] {
      --bg: #0a0a0d;
      --surface: #111116;
      --card: #16161c;
      --border: #222230;
      --border2: #2c2c3a;
      --accent: #7c6bff;
      --accent-h: #9585ff;
      --accent-bg: rgba(124,107,255,0.12);
      --accent-glow: rgba(124,107,255,0.25);
      --green: #22d48f;
      --rose: #ff5f7a;
      --txt: #eeeef5;
      --txt2: #9090aa;
      --txt3: #55556a;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--txt);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      line-height: 1.7;
    }
    /* SKELETON SHIMMER */
    .skeleton {
      background: linear-gradient(90deg, var(--border) 25%, var(--border2) 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite ease-in-out;
      border-radius: 12px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .skeleton-cover { width: 100%; height: 360px; border-radius: var(--radius); margin-bottom: 32px; }
    .skeleton-title { width: 85%; height: 44px; border-radius: 12px; margin-bottom: 20px; }
    .skeleton-tags { display: flex; gap: 10px; margin-bottom: 20px; }
    .skeleton-tag { width: 80px; height: 28px; border-radius: 30px; }
    .skeleton-meta { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .skeleton-avatar { width: 42px; height: 42px; border-radius: 50%; }
    .skeleton-meta-text { flex: 1; }
    .skeleton-line-sm { width: 180px; height: 14px; border-radius: 20px; margin-bottom: 8px; }
    .skeleton-line-xs { width: 110px; height: 12px; border-radius: 20px; }
    .skeleton-react-group { display: flex; gap: 12px; }
    .skeleton-react-btn { width: 90px; height: 38px; border-radius: 30px; }
    .skeleton-readtime { width: 100px; height: 32px; border-radius: 30px; }
    .skeleton-body { margin-top: 24px; }
    .skeleton-line { height: 18px; width: 100%; margin-bottom: 14px; border-radius: 8px; }
    .skeleton-line.short { width: 70%; }
    .skeleton-line.medium { width: 85%; }
    .skeleton-share { margin-top: 48px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
    .skeleton-share-btn { width: 100px; height: 40px; border-radius: 30px; }
    .skeleton-related-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 16px; }
    .skeleton-related-card { height: 180px; border-radius: var(--radius-sm); }
    .skeleton-comment { height: 100px; border-radius: var(--radius-sm); margin-bottom: 14px; }
    .hidden-content { display: none; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(17,17,22,0.85);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
      height: 56px;
    }
    .topbar-back {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--txt2);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--card);
      cursor: pointer;
      transition: all .15s;
      font-family: inherit;
    }
    .topbar-back:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-bg); }
    .topbar-back svg { width: 16px; height: 16px; flex-shrink: 0; }
    .topbar-logo {
      font-family: var(--font-head);
      font-size: 18px;
      font-weight: 800;
      color: var(--txt);
      letter-spacing: -0.4px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .topbar-logo-mark {
      width: 28px; height: 28px;
      background: var(--accent);
      border-radius: 8px;
      display: grid; place-items: center;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .topbar-logo-mark svg { width: 14px; height: 14px; fill: #fff; }
    .topbar-spacer { flex: 1; }
    .page-wrap {
      max-width: 780px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }
    .art-cover {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      border-radius: var(--radius);
      display: block;
      margin-bottom: 32px;
      border: 1px solid var(--border);
    }
    .art-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .art-tag {
      font-size: 11.5px; font-weight: 700;
      padding: 3px 10px; border-radius: 20px;
      background: var(--accent-bg); color: var(--accent);
      border: 1px solid var(--accent-glow);
      letter-spacing: 0.02em;
    }
    .art-title {
      font-family: var(--font-head);
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 800;
      color: var(--txt);
      line-height: 1.25;
      letter-spacing: -0.6px;
      margin-bottom: 18px;
    }
    .art-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .art-author-av {
      width: 38px; height: 38px;
      border-radius: 50%; object-fit: cover;
      background: var(--accent-bg);
      border: 2px solid var(--border);
    }
    .art-meta-info { flex: 1; }
    .art-author-name { font-size: 14px; font-weight: 700; color: var(--txt); }
    .art-date { font-size: 12px; color: var(--txt3); margin-top: 2px; }
    .art-read-time {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--txt3);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 10px;
      margin-left: auto;
      white-space: nowrap;
    }
    .art-read-time svg { flex-shrink: 0; }
    .art-reactions {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-left: auto;
      flex-wrap: wrap;
    }
    .art-react-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--txt2);
      font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      transition: all .15s;
    }
    .art-react-btn svg { width: 16px; height: 16px; }
    .art-react-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
    .art-react-btn.liked { border-color: var(--rose); color: var(--rose); background: rgba(255,95,122,0.1); }
    .art-react-btn.liked svg { fill: var(--rose); stroke: var(--rose); }
    .art-react-btn.echoed { border-color: var(--green); color: var(--green); background: rgba(34,212,143,0.08); }
    .art-body {
      font-size: 16px;
      line-height: 1.8;
      color: var(--txt2);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .art-share {
      margin-top: 40px;
      padding: 20px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .art-share-label { font-size: 13.5px; font-weight: 700; color: var(--txt); flex: 1; }
    .art-share-btns { display: flex; gap: 8px; }
    .art-share-btn {
      padding: 7px 16px;
      border-radius: var(--radius-sm);
      font-size: 12.5px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--txt2);
      text-decoration: none;
      display: inline-flex; align-items: center; gap: 6px;
      transition: all .15s;
    }
    .art-share-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
    .art-related { margin-top: 48px; }
    .art-related-title {
      font-family: var(--font-head);
      font-size: 18px; font-weight: 700;
      color: var(--txt);
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .art-related-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }
    .art-related-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      display: block;
      transition: all .2s;
    }
    .art-related-card:hover { border-color: var(--border2); transform: translateY(-2px); box-shadow: var(--shadow); }
    .art-related-cover {
      width: 100%; height: 120px; object-fit: cover;
      background: var(--surface); display: block;
    }
    .art-related-body { padding: 10px 12px; }
    .art-related-card-title { font-size: 13px; font-weight: 700; color: var(--txt); line-height: 1.35; margin-bottom: 5px; }
    .art-related-author { font-size: 11px; color: var(--txt3); }
    .art-comments { margin-top: 48px; }
    .art-comments-title {
      font-family: var(--font-head);
      font-size: 18px; font-weight: 700; color: var(--txt);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .art-comment-compose {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 24px;
    }
    .art-comment-compose input,
    .art-comment-compose textarea {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 13px;
      font-size: 13.5px;
      color: var(--txt);
      font-family: var(--font-body);
      outline: none;
      transition: border-color .15s;
      margin-bottom: 10px;
      display: block;
    }
    .art-comment-compose input::placeholder,
    .art-comment-compose textarea::placeholder { color: var(--txt3); }
    .art-comment-compose input:focus,
    .art-comment-compose textarea:focus { border-color: var(--accent); }
    .art-comment-compose textarea { resize: vertical; min-height: 80px; }
    .art-comment-submit {
      padding: 9px 22px;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: #fff;
      font-size: 13.5px; font-weight: 700;
      border: none; cursor: pointer;
      font-family: var(--font-body);
      transition: background .15s, transform .15s;
    }
    .art-comment-submit:hover { background: var(--accent-h); transform: translateY(-1px); }
    .art-comment-item {
      padding: 14px 16px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 10px;
      animation: artCardIn .2s ease both;
    }
    .art-comment-header { display: flex; gap: 8px; align-items: center; margin-bottom: 7px; }
    .art-comment-user { font-size: 13px; font-weight: 700; color: var(--txt); }
    .art-comment-time { font-size: 11.5px; color: var(--txt3); margin-left: auto; }
    .art-comment-text { font-size: 13.5px; color: var(--txt2); line-height: 1.6; }
    .art-reply-btn {
      font-size: 12px; font-weight: 600; color: var(--accent);
      background: none; border: none; cursor: pointer; margin-top: 8px;
      font-family: var(--font-body); padding: 0;
    }
    .art-reply-btn:hover { color: var(--accent-h); }
    .art-reply-form {
      margin-top: 12px; padding: 12px;
      background: var(--surface); border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }
    .art-reply-form input,
    .art-reply-form textarea {
      width: 100%;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px; color: var(--txt);
      font-family: var(--font-body);
      outline: none; transition: border-color .15s;
      margin-bottom: 8px; display: block;
    }
    .art-reply-form input:focus,
    .art-reply-form textarea:focus { border-color: var(--accent); }
    .art-reply-form textarea { resize: vertical; min-height: 60px; }
    .art-reply-submit {
      padding: 7px 16px;
      border-radius: 8px;
      background: var(--accent); color: #fff;
      font-size: 13px; font-weight: 700;
      border: none; cursor: pointer; font-family: var(--font-body);
    }
    .art-replies { margin-left: 20px; margin-top: 8px; }
    .reply-to-banner {
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--accent-bg);
      border: 1px solid var(--accent-glow);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
    }
    .reply-to-banner button {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 16px;
      cursor: pointer;
      margin-left: auto;
    }
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(70px);
      background: var(--card);
      border: 1px solid var(--border2);
      color: var(--txt);
      padding: 11px 22px;
      border-radius: 30px;
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: var(--shadow);
      z-index: 9999;
      transition: transform 0.2s ease, opacity 0.3s;
      opacity: 0;
      white-space: nowrap;
      pointer-events: none;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    @keyframes artCardIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 600px) {
      .page-wrap { padding: 24px 16px 60px; }
      .topbar { padding: 0 16px; }
      .skeleton-cover { height: 220px; }
    }
  </style>
</head>

  <button class="topbar-back" onclick="history.length > 1 ? history.back() : window.close()">

<main class="page-wrap">

  <div id="skeleton-wrapper">

    <div class="skeleton-tags"><div class="skeleton skeleton-tag"></div><div class="skeleton skeleton-tag"></div><div class="skeleton skeleton-tag"></div></div>

    <div class="skeleton-meta">
      <div class="skeleton skeleton-avatar"></div>
      <div class="skeleton-meta-text"><div class="skeleton skeleton-line-sm"></div><div class="skeleton skeleton-line-xs"></div></div>

        <a id="share-twitter" class="art-share-btn" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M23 3a10.9 10.9 0 01-3.14 1.53 4.48 4.48 0 00-7.86 3v1A10.66 10.66 0 013 4s-4 9 5 13a11.64 11.64 0 01-7 2c9 5 20 0 20-11.5a4.5 4.5 0 00-.08-.83A7.72 7.72 0 0023 3z"/></svg>Twitter</a>
        <a id="share-linkedin" class="art-share-btn" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6zM2 9h4v12H2z"/><circle cx="4" cy="4" r="2"/></svg>LinkedIn</a>
      </div>
    </div>
    <section class="art-related"><div class="art-related-title">Related Articles</div><div class="art-related-grid" id="related-grid"><div style="color:var(--txt3);font-size:13px">Loading related...</div></div></section>
    <section class="art-comments">
      <div class="art-comments-title">Comments</div>
      <div class="art-comment-compose">
        <div id="reply-to-banner" class="reply-to-banner"><svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" width="13" height="13"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 00-4-4H4"/></svg><span id="reply-to-label">Replying to <strong></strong></span><button onclick="cancelReply()" title="Cancel reply">✕</button></div>
        <input type="text" id="comment-username" placeholder="Your name (default: Anonymous)"/>
        <textarea id="comment-text" placeholder="Write a comment…"></textarea>
        <button class="art-comment-submit" onclick="postComment()">Post Comment</button>
      </div>
      <div id="comments-list"></div>
    </section>
  </div>
</main>
<div id="toast"></div>

<script>
  const API = window.location.hostname === 'www.circlenet.social' ? 'https://circleappapp-production.up.railway.app' : 'https://sizabeats:5000';
  const pathParts = window.location.pathname.split('/');
  const slug = pathParts[pathParts.length - 1];
  if (!slug || slug === 'full_blog.html') { document.body.innerHTML = '<div style="padding:40px;text-align:center">Invalid article URL</div>'; throw new Error('No article slug'); }

  let currentUser = null;
  try { currentUser = JSON.parse(localStorage.getItem('circle_user')); } catch(e) {}

  function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2800); }
  function goToLogin() { sessionStorage.setItem('_redirectAfterLogin', location.pathname); location.href = '/login'; }

  async function apiCall(method, path, body = null) {
    const opts = { method, headers: {} };
    if (currentUser) opts.headers['X-User-Id'] = currentUser.id;
    const token = localStorage.getItem('circle_token');
    if (token) opts.headers['Authorization'] = `Bearer ${token}`;
    if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    const res = await fetch(API + path, opts);
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Request failed');
    return data;
  }

  function calcReadTime(content) {
    if (!content || typeof content !== 'string') return '1 min read';
    const plainText = content.replace(/<[^>]+>/g, ' ');
    const words = plainText.trim().split(/\s+/).filter(Boolean).length;
    const mins = Math.max(1, Math.ceil(words / 200));
    return `${mins} min read`;
  }

  function updateMetaContent(selector, attr, value) { const tag = document.querySelector(selector); if (tag && value) tag.setAttribute(attr, value); }
  function updateCanonical(url) { const link = document.querySelector('link[rel="canonical"]'); if(link && url) link.href = url; }

  let article = null;
  (async () => {
    try {
      let res;
      try { res = await apiCall('GET', `/api/articles/by-slug/${encodeURIComponent(slug)}`); } catch { res = await apiCall('GET', `/api/articles?slug=${encodeURIComponent(slug)}`); }
      article = res.data || res;
      if (!article?.id) throw new Error('Article not found');

      document.title = `${article.title} · Circle`;
      document.getElementById('blog-title').innerHTML = article.title;
      document.getElementById('blog-author').innerHTML = article.author || 'Anonymous';
      const formattedDate = article.createdAt || article.created_at ? new Date(article.createdAt || article.created_at).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' }) : '—';
      document.getElementById('blog-date').innerHTML = formattedDate;

      const content = article.content || article.body || 'No content available.';
      document.getElementById('blog-content').innerHTML = content;
      const readSpan = document.querySelector('#blog-read-time span');
      if(readSpan) readSpan.textContent = calcReadTime(content);

      const cover = article.cover_image || article.coverImage;
      const img = document.getElementById('blog-image');
      img.src = cover || 'https://placehold.co/800x420/111116/7c6bff?text=Article';

      const pageUrl = window.location.href;
      const seoDesc = article.excerpt || (article.content ? article.content.replace(/<[^>]+>/g,'').slice(0,160) : 'Read this article on Circle.');
      const seoImage = cover || 'https://placehold.co/1200x630/7c6bff/ffffff?text=Circle';

      updateMetaContent('meta[name="description"]', 'content', seoDesc);
      updateMetaContent('meta[property="og:title"]', 'content', article.title);
      updateMetaContent('meta[property="og:description"]', 'content', seoDesc);
      updateMetaContent('meta[property="og:image"]', 'content', seoImage);
      updateMetaContent('meta[property="og:url"]', 'content', pageUrl);
      updateMetaContent('meta[name="twitter:title"]', 'content', article.title);
      updateMetaContent('meta[name="twitter:description"]', 'content', seoDesc);
      updateMetaContent('meta[name="twitter:image"]', 'content', seoImage);
      updateCanonical(pageUrl);

      const schema = document.getElementById('article-schema');
      if(schema) schema.textContent = JSON.stringify({ '@context':'https://schema.org','@type':'Article','headline':article.title,'description':seoDesc,'image':seoImage,'author':{'@type':'Person','name':article.author || 'Circle'},'datePublished':new Date(article.createdAt || article.created_at).toISOString(),'url':pageUrl,'publisher':{'@type':'Organization','name':'Circle'}});

      const tagsContainer = document.getElementById('blog-tags');
      tagsContainer.innerHTML = (article.tags?.length) ? article.tags.map(t => `<span class="art-tag">${esc(t)}</span>`).join('') : '';
      const av = document.getElementById('blog-author-av');
      const authorPic = article.authorPicture || article.author_picture;
      av.src = authorPic || `https://placehold.co/76/7c6bff/fff?text=${(article.author || 'A').charAt(0)}`;

      document.getElementById('react-like-count').innerHTML = article.like_count || article.likes || 0;
      document.getElementById('react-echo-count').innerHTML = article.echo_count || article.echoes || 0;
      if(article.userLiked) document.getElementById('react-like-btn').classList.add('liked');
      if(article.userEchoed) document.getElementById('react-echo-btn').classList.add('echoed');

      const pageUrlEnc = encodeURIComponent(pageUrl);
      const pageTitleEnc = encodeURIComponent(article.title);
      document.getElementById('share-facebook').href = `https://www.facebook.com/sharer/sharer.php?u=${pageUrlEnc}`;
      document.getElementById('share-twitter').href = `https://twitter.com/intent/tweet?text=${pageTitleEnc}&url=${pageUrlEnc}`;
      document.getElementById('share-linkedin').href = `https://www.linkedin.com/shareArticle?mini=true&url=${pageUrlEnc}&title=${pageTitleEnc}`;

      document.getElementById('skeleton-wrapper').style.display = 'none';
      document.getElementById('real-content').style.display = 'block';

      loadComments();
      loadRelated();
    } catch(err) {
      document.getElementById('skeleton-wrapper').innerHTML = `<div style="padding:40px;text-align:center;color:var(--rose)">⚠️ Failed to load: ${err.message}</div>`;
    }
  })();

  window.toggleLike = async function() { if (!currentUser) { goToLogin(); return; } try { const res = await apiCall('POST', `/api/articles/${article.id}/like`); document.getElementById('react-like-count').innerHTML = res.data.likes; const btn = document.getElementById('react-like-btn'); if (res.data.liked) btn.classList.add('liked'); else btn.classList.remove('liked'); } catch(e) { showToast(e.message); } };
  window.toggleEcho = async function() { if (!currentUser) { goToLogin(); return; } try { const res = await apiCall('POST', `/api/articles/${article.id}/echo`); document.getElementById('react-echo-count').innerHTML = res.data.echoes; const btn = document.getElementById('react-echo-btn'); if (res.data.echoed) btn.classList.add('echoed'); else btn.classList.remove('echoed'); } catch(e) { showToast(e.message); } };

  let _replyTo = null;
  window.postComment = async function() { if (!currentUser) { goToLogin(); return; } const text = document.getElementById('comment-text').value.trim(); if (!text) return; const payload = { text }; if (_replyTo) payload.parentId = _replyTo.commentId; try { await apiCall('POST', `/api/articles/${article.id}/comment`, payload); document.getElementById('comment-text').value = ''; cancelReply(); await loadComments(); showToast('Comment added!'); } catch(e) { showToast(e.message); } };
  window.startReplyTo = function(commentId, authorName) { _replyTo = { commentId, author: authorName }; const banner = document.getElementById('reply-to-banner'); if (banner) { document.getElementById('reply-to-label').innerHTML = `Replying to <strong>${esc(authorName)}</strong>`; banner.style.display = 'flex'; } document.getElementById('comment-text').focus(); };
  window.cancelReply = function() { _replyTo = null; const banner = document.getElementById('reply-to-banner'); if (banner) banner.style.display = 'none'; };

  async function loadComments() { if (!article) return; try { const res = await apiCall('GET', `/api/articles/${article.id}`); const comments = res.data.comments || []; const container = document.getElementById('comments-list'); if (!comments.length) { container.innerHTML = '<div style="color:var(--txt3);padding:8px 0">No comments yet. Be the first!</div>'; return; } function buildComment(c, depth = 0) { const indent = depth > 0 ? `margin-left:${Math.min(depth*18,36)}px;` : ''; const repliesHtml = (c.replies || []).map(r => buildComment(r, depth+1)).join(''); return `<div class="art-comment-item" style="${indent}"><div class="art-comment-header"><span class="art-comment-user">${esc(c.author)}</span><span class="art-comment-time">${new Date(c.createdAt).toLocaleString()}</span></div><div class="art-comment-text">${esc(c.text)}</div>${currentUser ? `<button class="art-reply-btn" onclick="startReplyTo(${c.id},'${esc(c.author)}')">↩ Reply</button>` : ''}</div>${repliesHtml}`; } container.innerHTML = comments.map(c => buildComment(c)).join(''); } catch(e) { console.error(e); } }

  async function loadRelated() { if (!article || !article.tags?.length) { document.getElementById('related-grid').innerHTML = '<div style="color:var(--txt3);font-size:13px">No related articles found.</div>'; return; } try { let relatedArticles = []; for (const tag of article.tags) { if (relatedArticles.length >= 3) break; const res = await apiCall('GET', `/api/articles?tag=${encodeURIComponent(tag)}&limit=6`); let articles = res.data?.articles || res.articles || []; if (!Array.isArray(articles)) articles = []; const filtered = articles.filter(a => a.id !== article.id); for (const a of filtered) if (!relatedArticles.some(ex => ex.id === a.id)) relatedArticles.push(a); } relatedArticles = relatedArticles.slice(0,3); const grid = document.getElementById('related-grid'); if (!relatedArticles.length) { grid.innerHTML = '<div style="color:var(--txt3);font-size:13px">No related articles found.</div>'; return; } grid.innerHTML = relatedArticles.map(rel => { const relSlug = rel.slug || rel.title.toLowerCase().replace(/[^\w]+/g,'-'); const relCover = rel.cover_image || rel.coverImage || 'https://placehold.co/400x240/16161c/7c6bff?text=Article'; return `<a class="art-related-card" href="/articles/${encodeURIComponent(relSlug)}" target="_blank" rel="noopener"><img class="art-related-cover" src="${esc(relCover)}" alt="${esc(rel.title)}" onerror="this.onerror=null;this.src='https://placehold.co/400x240/16161c/7c6bff?text=Article'"/><div class="art-related-body"><div class="art-related-card-title">${esc(rel.title)}</div><div class="art-related-author">${esc(rel.author || 'Anonymous')}</div></div></a>`; }).join(''); } catch(e) { console.error(e); document.getElementById('related-grid').innerHTML = '<div style="color:var(--txt3);font-size:13px">Could not load related articles.</div>'; } }
</script>
</body>
</html>
